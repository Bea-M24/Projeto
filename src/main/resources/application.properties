spring.application.name=projeto

# ===================================================================
# CONFIGURAÇÕES DO DATA SOURCE (CONEXÃO COM O BANCO DE DADOS)
# ===================================================================

# Endereço do banco de dados usando variável de ambiente
spring.datasource.url=${DB_URL}

# Usuário e senha do MySQL usando variáveis de ambiente
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ^^^^ Os mais importantes ^^^^

# Driver de conexão com o MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# CONFIGURAÇÕES DO JPA / HIBERNATE
# ===================================================================

# Estratégia de geração das tabelas
spring.jpa.hibernate.ddl-auto=update

# Mostra as queries SQL executadas no console
spring.jpa.show-sql=true

# Formata as queries SQL no console
spring.jpa.properties.hibernate.format_sql=true

# Define o dialeto do MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
